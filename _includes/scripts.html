<script src="assets/js/main.min.js"></script>
<script>
  document.querySelectorAll(".wechat-toggle").forEach(function (link) {
    link.addEventListener("click", function (event) {
      event.preventDefault();
      document.querySelectorAll(".wechat-toggle").forEach(function (wechatLink) {
        var label = wechatLink.querySelector(".wechat-label");
        label.textContent = wechatLink.getAttribute("data-wechat");
        wechatLink.setAttribute("title", "WeChat: " + wechatLink.getAttribute("data-wechat"));
      });
    });
  });
</script>
